version: "3.8"

services:
  solar-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_filament_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - ./backend/models:/app/backend/models
      - ./outputs:/app/outputs
      - ./mlflow.db:/app/mlflow.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mlflow-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_mlflow_ui
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
      - MLFLOW_ALLOW_FILE_STORE=true
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    command: ["mlflow", "ui", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////app/mlflow.db"]
    depends_on:
      - solar-api
